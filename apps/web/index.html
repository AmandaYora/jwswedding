<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap"
      rel="stylesheet"
    />
    <title>JWS Wedding — Client Transparency Portal</title>
    <!-- Platform defaults -- swapped server-side per tenant custom domain,
         see cmd/server/main.go's injectTenantSiteMeta (exact-string match). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JWS Wedding" />
    <meta property="og:title" content="JWS Wedding — Client Transparency Portal" />
    <meta property="og:description" content="Transparansi persiapan pernikahan Anda, dari WO hingga hari H." />
    <!-- PWA "Add to Home Screen" (docs/plan/ikon-homescreen-pwa/PLAN.md) --
         both URLs are tenant-neutral (they resolve the tenant server-side
         from the request's own Host header), so they're static here, unlike
         the tenant-specific tags above that injectTenantSiteMeta swaps.
         Android reads the manifest for its icon; iOS Safari ignores the
         manifest for icons entirely and only reads apple-touch-icon, so
         both tags are required, not a choice between them. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/api/v1/public/app-icon/180" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
