# Optional reverse proxy in front of the app container.
# NOTE: this file is only an example — production nginx is written directly
# on the VPS (docs/DEPLOYMENT.md §6, butir 5: "nginx + TLS front the
# container's 127.0.0.1:8080"). Keep client_max_body_size in sync
# there too (PLAN revisi-vendor-venue-portal §4.7/E0): a 15 MB PDF becomes
# ~20 MB of base64 JSON, over nginx's 1 MB default.
# proxy_read_timeout must also be mirrored on the VPS: nginx's 60s default is
# shorter than the rundown generate budget (110s, rundown_handler.go
# generateBudget — PDF conversion plus its one-at-a-time queue), so a slow PDF
# would otherwise come back as a 504 while the app is still working on it.
server {
  listen 80;
  client_max_body_size 25m;
  location / {
    proxy_read_timeout 120s;
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
